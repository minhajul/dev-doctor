[package]
name = "devdoctor"
version = "0.1.0"
edition = "2021"
description = "Developer environment diagnostics CLI"
license = "MIT"
repository = "https://github.com/minhajul/dev-doctor"
readme = "README.md"
keywords = ["cli", "diagnostics", "developer", "tools", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "devdoctor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
owo-colors = { version = "4.1", features = ["supports-colors"] }
which = "6.0"
hostname = "0.4"
whoami = "1.5"
toml = "0.8"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.10"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
