# devdoctor configuration
# Copy to ~/.config/devdoctor/config.toml

# Default command timeout in seconds (used when no override)
timeout_seconds = 5

# Tools to detect. If absent, all defaults are used.
[tools]
enabled = [
    "git",
    "docker",
    "go",
    "rustc",
    "cargo",
    "node",
    "npm",
    "pnpm",
    "python3",
    "php",
    "composer",
    "kubectl",
    "helm",
    "terraform",
    "aws",
]

# Optional version requirements per tool (>=, >, <=, <, =; comma-separated).
# A bare version matches by prefix, so "1.9" accepts any 1.9.x.
# [tools.versions]
# node = ">=20"
# go = ">=1.22, <2"

# Optional per-tool hints shown when a tool check fails
# [tools.hints]
# node = "run `nvm use`"

# Ports to probe (TCP listen check)
[ports]
check = [3000, 3306, 5432, 6379, 8000, 8080, 9000]
# Fail if nothing is listening on these ports (e.g. a local database)
# expect_listening = [5432]
# Fail if these ports are already taken (e.g. the dev server port)
# expect_free = [3000]
# Optional per-port hints (keys are port numbers)
# [ports.hints]
# 5432 = "docker compose up -d db"

# Environment variables that must be set (values are never printed)
# [env]
# required = ["DATABASE_URL"]
# [env.hints]
# DATABASE_URL = "cp .env.example .env"

# Kubernetes behavior
[kubernetes]
# Warn (instead of pass) when the current namespace is "default"
warn_default_namespace = true
